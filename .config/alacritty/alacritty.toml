[font]
size = 11.0

[font.normal]
family = "FreeMono"
style = "Bold"

[font.bold]
family = "FreeMono"
style = "Bold"

[font.italic]
family = "FreeMono"
style = "Regular"

[font.bold_italic]
family = "FreeMono"
style = "Bold"

[window]
padding = { x = 0, y = 0 }
opacity = 1.0

[colors.primary]
background = "#000000"
foreground = "#dddddd"

[colors.cursor]
cursor = "#cccccc"
text = "#111111"

[colors.selection]
background = "#fffacd"
text = "#000000"

[colors.normal]
black = "#000000"
red = "#cc0403"
green = "#19cb00"
yellow = "#cecb00"
blue = "#0d73cc"
magenta = "#cb1ed1"
cyan = "#0dcdcd"
white = "#dddddd"

[colors.bright]
black = "#767676"
red = "#f2201f"
green = "#23fd00"
yellow = "#fffd00"
blue = "#1a8fff"
magenta = "#fd28ff"
cyan = "#14ffff"
white = "#ffffff"


[cursor]
style = { shape = "Block", blinking = "Off" }
