layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace overlay
layerrule = blur on, match:namespace gtk-layer-shell
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace mako

windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = size 960 540, match:title ^(Picture-in-Picture)$
windowrule = move 25% 75%, match:title ^(Picture-in-Picture)$
windowrule = no_blur on, match:class ^(firefox)$
windowrule = opacity 0.8 0.8, match:class ^(thunar)$
windowrule = opacity 0.8 0.8, match:class ^(Spotify)$
windowrule = opacity 0.8 0.8, match:class ^(WebCord)$
windowrule = opacity 0.9 0.9, match:class ^(Code)$
windowrule = opacity 0.9 0.9, match:class ^(mako)$
windowrule = opacity 0.7 0.7, match:float yes
windowrule = float on, match:class ^()$, match:title ^(Picture in picture)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(xdg-desktop-portal-kde)$
windowrule = float on, match:class ^(xdg-desktop-portal-hyprland)$
windowrule = float on, match:title ^(submap)$
windowrule = center on, match:title ^(submap)$
windowrule = tile on, match:title ^(Developer Tools.*)$
